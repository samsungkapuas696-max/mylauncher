<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      color: white;
      background: linear-gradient(160deg, #1e3c72, #2a5298);
      height: 100vh;
      padding: 40px 16px 16px;
      overflow: hidden;
    }

    .clock {
      font-size: 56px;
      text-align: center;
      margin-bottom: 16px;
    }

    #search {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      text-align: center;
      padding: 8px 4px;
      border-radius: 12px;
      cursor: pointer;
      word-break: break-word;
    }

    .app:active { background: rgba(255, 255, 255, 0.2); }

    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.15);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="clock" id="clock">00:00</div>
  <input type="text" id="search" placeholder="Cari aplikasi...">
  <div id="grid" class="grid"></div>

  <script>
    // Data tiruan untuk uji coba di browser (tidak dipakai di APK)
    const mockApps = [
      { name: "Kamera", pkg: "com.example.camera" },
      { name: "Galeri", pkg: "com.example.gallery" },
      { name: "Kalender", pkg: "com.example.calendar" },
      { name: "Musik", pkg: "com.example.music" },
      { name: "Pengaturan", pkg: "com.example.settings" },
      { name: "Browser", pkg: "com.example.browser" },
      { name: "Kontak", pkg: "com.example.contacts" },
      { name: "Catatan", pkg: "com.example.notes" },
      { name: "Jam", pkg: "com.example.clock" },
      { name: "Peta", pkg: "com.example.maps" },
      { name: "Email", pkg: "com.example.email" },
      { name: "Kalkulator", pkg: "com.example.calc" }
    ];

    // Jika Android tidak ada (browser biasa), pakai objek tiruan
    const isAndroid = typeof Android !== "undefined";
    const bridge = isAndroid ? Android : {
      getApps: () => JSON.stringify(mockApps),
      launch: (pkg) => alert("Membuka: " + pkg)
    };

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const clock = document.getElementById("clock");
    let allApps = [];

    // Jam
    function updateClock() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Tampilkan daftar aplikasi
    function render(list) {
      grid.innerHTML = "";
      list.forEach(app => {
        const item = document.createElement("div");
        item.className = "app";

        const icon = document.createElement("div");
        icon.className = "app-icon";
        icon.textContent = app.name.charAt(0).toUpperCase();

        const label = document.createElement("span");
        label.textContent = app.name;

        item.appendChild(icon);
        item.appendChild(label);
        item.onclick = () => bridge.launch(app.pkg);
        grid.appendChild(item);
      });
    }

    // Ambil daftar aplikasi
    function loadApps() {
      allApps = JSON.parse(bridge.getApps());
      allApps.sort((a, b) => a.name.localeCompare(b.name));
      render(allApps);
    }

    // Pencarian
    search.addEventListener("input", () => {
      const q = search.value.toLowerCase();
      render(allApps.filter(a => a.name.toLowerCase().includes(q)));
    });

    loadApps();
  </script>
</body>
</html>
